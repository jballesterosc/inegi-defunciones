[project]
name = "inegi-defunciones"
version = "0.1.0"
description = "Scraper for INEGI's Estadísticas de Defunciones Registradas (EDR) open microdata"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "numpy>=1.24",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[project.scripts]
inegi-defunciones = "inegi_defunciones.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inegi_defunciones"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
